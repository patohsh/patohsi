<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patohsi - Main</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. 메인 히어로 영역 -->
    <header class="hero-section">
        <div class="slideshow-container">
            <div class="slide active"><img src="assets/main_hero.jpg" class="hero-img"></div>
            <div class="slide"><img src="assets/main_hero1.png" class="hero-img"></div>
            <div class="slide"><img src="assets/main_hero2.jpg" class="hero-img"></div>
        </div>
        <div class="timer-bar-container">
            <div class="timer-bar"></div>
        </div>
    </header>

    <!-- 2. 커미션 카드 영역 -->
    <main class="content-section">
        <div class="commission-card placeholder-bg">
            <div class="art-preview">
                <img src="assets/commission_art.jpg" onerror="this.style.display='none'">
            </div>

            <div class="status-overlay">
                <h3>커미션 페이지 입니다.</h3>
                <p>
                    빠른 작업을 위해 가격표를 먼저 확인해 주세요.<br>
                    이메일로 먼저 문의 주시면 빠르게 진행 가능합니다.
                </p>

                <a href="commission/index.html" class="consult-btn">
                    Room In Consultation <i class="fa-solid fa-chevron-right"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- 3. 프로필 영역 (흰색 배경) -->
    <!-- 여기서 곡선을 만들지 않고 직사각형으로 끝냅니다 -->
    <section class="profile-section">
        <div class="profile-content">
            <div class="profile-img-box placeholder-bg">
                <img src="assets/profile.jpg" alt="Profile" onerror="this.style.display='none'">
            </div>
            <h2 class="profile-name">Patohsi</h2>
            <p class="profile-desc">안녕하세요 파토입니다. 편하게 파토씨, 파토님 이라고 불러주세요.</p>

            <!-- SNS 아이콘 (이미지) -->
            <div class="social-links">
                <a href="https://www.instagram.com/patohsi/"><img src="assets/sns_insta.png" alt="Insta"></a>
                <a href="https://x.com/aoiusagi_cm"><img src="assets/sns_x.png" alt="X"></a>
                <a href="https://www.youtube.com/@patohsi"><img src="assets/sns_yt.png" alt="Youtube"></a>
                <a href="https://github.com/patohsh"><img src="assets/sns_git.png" alt="Github"></a>
            </div>
        </div>
    </section>

    <!-- ★★★ 프로필 하단 곡선 (SVG) ★★★ -->
    <!-- 화면 너비에 상관없이 예쁜 곡선을 유지하는 핵심 부분 -->
    <div class="profile-curve-container">
        <svg viewBox="0 0 1440 320" preserveAspectRatio="none" class="profile-curve-svg">
            <!--
               곡선 모양 수정:
               M0,0 : 왼쪽 위 시작
               L1440,0 : 오른쪽 위로 이동 (직선)
               C1440,0 1100,300 720,300 : 오른쪽에서 중앙 아래로 내려오는 곡선
               C340,300 0,0 0,0 : 중앙 아래에서 왼쪽 위로 올라가는 곡선
            -->
            <path d="M0,-1 L1440,-1 L1440,0 C1440,0 1150,280 720,280 C290,280 0,0 0,0 Z" fill="#fff"></path>
        </svg>
    </div>

    <!-- 하단 검은색 영역 확보 (푸터 역할) -->
    <div class="black-footer-area"></div>

    <!-- 4. 스크롤 탑 버튼 -->
    <div id="scroll-top-btn" onclick="scrollToTop()">
        <img src="assets/top_btn.png" class="top-btn-img">
    </div>

    <!-- 5. 하단 네비게이션 -->
    <div class="bottom-nav-wrapper">
        <div class="nav-glow"></div>
        <nav id="main-nav" class="nav-bar">
            <!-- 사다리꼴 네비게이션 형태 -->
            <div class="nav-bump-svg-container" onclick="toggleNav()">
                <svg viewBox="0 0 400 60" preserveAspectRatio="none" class="bump-svg">
                    <path d="M0,60 L110,60 Q140,60 150,40 L160,15 Q165,0 185,0 L215,0 Q235,0 240,15 L250,40 Q260,60 290,60 L400,60 Z" fill="#fff"></path>
                </svg>
                <img src="assets/star_icon.png" class="trigger-icon">
            </div>

            <ul class="nav-links">
                <li class="nav-item"><a href="profile/index.html">PROFILE</a></li>
                <li class="nav-item"><a href="portfolio/index.html">PORTFOLIO</a></li>
                <li class="spacer"></li>
                <li class="nav-item"><a href="blog/index.html">BLOG</a></li>
                <li class="nav-item"><a href="commission/index.html">COMMISSION</a></li>
            </ul>
        </nav>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js"></script>
</body>
</html>
